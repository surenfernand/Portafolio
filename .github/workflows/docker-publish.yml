name: Build and publish Web Loom Zone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-loom-zone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_NAME: web-loom-zone
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Validate website files
        run: python3 deploy/check_site.py

      - name: Check Docker Hub username
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Add the DOCKERHUB_USERNAME repository secret first."
            exit 1
          fi
          if ! printf '%s' "$DOCKERHUB_USERNAME" | grep -Eq '^[a-z0-9][a-z0-9_-]*$'; then
            echo "Use your lowercase Docker Hub username, not your email address."
            exit 1
          fi

      - name: Build image on GitHub
        run: |
          docker build --platform linux/amd64 \
            -t "$DOCKERHUB_USERNAME/$IMAGE_NAME:latest" \
            -t "$DOCKERHUB_USERNAME/$IMAGE_NAME:$GITHUB_SHA" .

      - name: Start container for smoke check
        run: |
          docker run -d --name web-loom-smoke \
            -p 127.0.0.1:8088:80 \
            "$DOCKERHUB_USERNAME/$IMAGE_NAME:$GITHUB_SHA"
          docker exec web-loom-smoke nginx -t
          python3 deploy/check_site.py --url http://127.0.0.1:8088

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish tested image
        run: |
          docker push "$DOCKERHUB_USERNAME/$IMAGE_NAME:$GITHUB_SHA"
          docker push "$DOCKERHUB_USERNAME/$IMAGE_NAME:latest"

      - name: Clean up smoke container
        if: always()
        run: docker rm -f web-loom-smoke || true
